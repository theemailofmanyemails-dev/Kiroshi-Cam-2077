name: Build Kiroshi Optics Standalone Offline APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Compile Standalone Offline APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP Archive if Uploaded Directly
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Detected uploaded zip archive: $ZIP_FILE — extracting..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Standalone Offline Web Bundle (Vite)
        run: npm run build

      - name: Generate & Sync Capacitor Android Project
        run: |
          if [ -d "android" ]; then
            rm -rf android
          fi
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Build Debug & Release APKs with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Sign Release APK for Direct Sideload Installation
        working-directory: ./android
        run: |
          mkdir -p ../output-apks
          cp app/build/outputs/apk/debug/app-debug.apk ../output-apks/Kiroshi-Optics-MKV-debug.apk

          # Generate a self-signed release keystore so the Release APK is immediately installable on any Android device
          keytool -genkeypair -v             -keystore kiroshi-release.keystore             -alias kiroshi             -keyalg RSA             -keysize 2048             -validity 10000             -storepass kiroshi2077             -keypass kiroshi2077             -dname "CN=Kiroshi Optics, OU=Netrunner Division, O=Kiroshi, L=NightCity, S=CA, C=US"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4             app/build/outputs/apk/release/app-release-unsigned.apk             app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign             --ks kiroshi-release.keystore             --ks-key-alias kiroshi             --ks-pass pass:kiroshi2077             --key-pass pass:kiroshi2077             --out ../output-apks/Kiroshi-Optics-MKV-release-signed.apk             app-release-aligned.apk

          ls -lh ../output-apks/

      - name: Upload Compiled APKs to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kiroshi-Optics-MKV-APKs
          path: output-apks/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Kiroshi Optics MK.V Offline APK (Build #${{ github.run_number }})"
          body: |
            ### Kiroshi Optics MK.V — Standalone Offline Android APK
            - **`Kiroshi-Optics-MKV-release-signed.apk`**: Signed production release APK (recommended — install directly on any Android device).
            - **`Kiroshi-Optics-MKV-debug.apk`**: Debug APK with WebView inspect enabled.
          files: |
            output-apks/Kiroshi-Optics-MKV-release-signed.apk
            output-apks/Kiroshi-Optics-MKV-debug.apk
